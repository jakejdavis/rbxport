name: rbxport
options:
  bundleIdPrefix: com.rbxport
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    # A stable signature keeps macOS privacy grants across rebuilds.
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ZDPLUTEA7D
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  rbxport:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Resources
        buildPhase: resources
      # Produced by scripts/build-rust.sh; run it before `xcodegen`.
      - path: Generated/swift
    dependencies:
      - framework: Generated/rbl_ffi.xcframework
        embed: false
        link: true
    # AppleScript: Cocoa Scripting reads the dictionary named here from the bundle's Resources.
    preBuildScripts:
      - name: Build Rust bridge
        script: |
          if [ "$CONFIGURATION" = "Release" ]; then P=release; else P=debug; fi
          "$SRCROOT/scripts/build-rust.sh" "$P"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_NAME: rbxport
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.rbxport.native
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: rbxport
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        INFOPLIST_KEY_NSHumanReadableCopyright: GPL-2.0-or-later
        ENABLE_HARDENED_RUNTIME: NO
        # Static Rust library: SQLCipher/OpenSSL/sysinfo/CoreAudio/Rubber Band (Accelerate) need these;
        # see `cargo rustc -p rbl-ffi --crate-type staticlib -- --print native-static-libs`.
        OTHER_LDFLAGS: "-lc++ -framework Security -framework CoreFoundation -framework SystemConfiguration -framework IOKit -framework CoreMIDI -framework CoreAudio -framework AudioToolbox -framework Accelerate -framework DiskArbitration -framework Foundation"
  rbxportTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: rbxport
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.rbxport.native.tests
schemes:
  rbxport:
    build:
      targets:
        rbxport: all
    test:
      config: Debug
      targets:
        - rbxportTests
    run:
      config: Debug
